## Provide a list of servers, which thumbs is allowed to connect to, i.e.
#thumbs.whitelist[0]=localhost
#thumbs.whitelist[1]=mars.nasa.gov

## Specify a location where thumbs stores thumbnails, i.e.
#thumbs.storageLocation=/home/johndoe

## Specify Picture Location 
#thumbnail.pathToDefaultPic=classpath:static/img/document.png

## Change embedded server properties as you want
## note: default port of embedded tomcat server is 8080
#server.port=9001
server.servlet.context-path=/thumbs

